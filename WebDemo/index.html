<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#030606"><title>晴天 · 光的四个瞬间</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:,"></head>
<body>
  <main id="stage" aria-label="晴天实时粒子演出"><canvas id="art" aria-label="由音乐驱动的粒子画面"></canvas><img id="reference" alt="风格帧对照" hidden></main>
  <header class="ui"><div class="identity"><h1>晴天</h1><span>光的四个瞬间</span></div><div class="top-actions"><span id="status" role="status">正在准备光场…</span><button id="fullscreen" title="F 全屏">全屏</button><button id="hide" title="H 隐藏界面；Esc 恢复">纯画面</button></div></header>
  <section id="welcome" class="ui" aria-label="开始演出"><p>聚 · 分 · 近 · 散</p><h2>让光，随音乐经过。</h2><button id="begin" disabled>正在准备…</button><p id="source-note">本地演出 · 无需联网</p><label class="file-pick">选择本地音频<input id="file" type="file" accept="audio/*"></label></section>
  <footer class="ui" id="transport">
    <div class="chapter-line"><span id="chapter-name">C1 / 旧光短暂聚拢</span><span id="state-label">风格帧预览</span></div>
    <label class="sr-only" for="seek">播放进度</label><input id="seek" type="range" min="0" max="269.747" step="0.001" value="0">
    <div class="controls"><div class="playback"><button id="play" disabled aria-label="播放或暂停">播放</button><button id="restart" title="R 从头开始">重播</button><output id="clock">00:00 / 04:29</output></div><nav aria-label="关键时刻"><button data-anchor="0" title="1 · 56.80 秒">C1 <span>聚</span></button><button data-anchor="1" title="2 · 93.61 秒">C2 <span>分</span></button><button data-anchor="2" title="3 · 155.41 秒">C3 <span>近</span></button><button data-anchor="3" title="4 · 264.05 秒">C4 <span>散</span></button></nav><div class="tools"><button id="overlay-toggle" title="O 叠加风格帧" aria-pressed="false">对照</button><button id="debug-toggle" title="D 参数面板" aria-expanded="false">参数</button><select id="quality" aria-label="画质"><option value="high">原画质</option><option value="medium" selected>流畅</option><option value="low">省电</option></select></div></div>
    <div id="overlay-controls" hidden><label>参考帧 <select id="reference-choice"><option value="auto">最近锚点</option><option value="0">C1</option><option value="1">C2</option><option value="2">C3</option><option value="3">C4</option></select></label><label>叠加透明度 <input id="opacity" type="range" min="0" max="1" value="0.5" step="0.01"></label><output id="opacity-value">50%</output><span>参考图仅在开启对照时显示</span></div>
  </footer>
  <aside id="debug" class="ui" hidden aria-label="参数监视"><h2>音乐 → 光</h2><p id="performance">等待测量</p><div class="meters"><label>音量 RMS <meter id="rms" min="0" max="1"></meter></label><label>低频 <meter id="low" min="0" max="1"></meter></label><label>高频 <meter id="high" min="0" max="1"></meter></label><label>68 BPM <meter id="beat" min="0" max="1"></meter></label><label>歌词句聚散 <meter id="phrase" min="0" max="1"></meter></label></div><label class="audio-switch"><input id="audio-reactive" type="checkbox" checked> 形体音频驱动</label><p>关闭后仍播放音乐，但只保留微弱基础流动。P 可隐藏所有小亮点，检查大形体是否仍在运动。</p><label class="audio-switch"><input id="small-points" type="checkbox" checked> 显示小亮点（P）</label><pre id="applied-readout"></pre><label>音乐响应强度 <input id="response" type="range" min="0.25" max="2" value="1" step="0.05"> <output id="response-value">1.0×</output></label><details><summary>完整时间与布局参数</summary><pre id="parameter-readout"></pre></details><label>动态幅度 <input id="motion" type="range" min="0" max="1.8" value="1" step="0.05"></label><p>空格 播放 / 暂停 · 1–4 锚点<br>F 全屏 · H 隐藏 · O 对照 · D 参数<br>Esc 恢复界面 · ← / → 前后 5 秒</p><label class="file-pick">更换本地音频<input id="replace-file" type="file" accept="audio/*"></label><a href="LocalOnly/晴天_整曲备份.mp4" target="_blank">打开本地备份视频</a></aside>
  <div id="error" role="alert" hidden></div>
  <script type="module" src="src/app.mjs"></script>
</body></html>
